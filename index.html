<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lichess Turnuva Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e0e; --surface: #181818; --surface2: #222;
      --border: #2a2a2a; --border2: #383838;
      --text: #f0f0e8; --muted: #888;
      --accent: #c8b560; --accent2: #e8d080;
      --green: #5cba7d; --red: #d96060; --amber: #d4a830;
      --r: 8px;
    }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 16px; }
    .page { max-width: 860px; margin: 0 auto; }

    header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .logo-box { width: 40px; height: 40px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .logo-title { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; color: var(--text); }
    .logo-title span { color: var(--accent); }
    .logo-sub { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }

    label { display: block; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
    input[type=text], input[type=number] {
      width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--r);
      color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px;
      padding: 10px 14px; outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #444; }

    .input-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 14px; align-items: end; }

    #btn {
      padding: 10px 22px; background: var(--accent); color: #0e0e0e;
      border: none; border-radius: var(--r); font-family: 'IBM Plex Mono', monospace;
      font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    #btn:hover { background: var(--accent2); }
    #btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .stat { background: var(--surface2); border-radius: var(--r); padding: 14px 16px; }
    .col-green { color: var(--green); }
    .col-amber { color: var(--amber); }

    .tour-title { font-size: 15px; font-weight: 600; color: var(--accent); font-family: 'IBM Plex Mono', monospace; margin-bottom: 3px; }
    .tour-meta { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-bottom: 18px; }



    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .filter-btn { padding: 6px 14px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0e0e0e; }
    .search-wrap { flex: 1; min-width: 160px; }
    .search-wrap input { padding: 6px 12px; font-size: 12px; }
    .copy-btn { padding: 6px 14px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--border2); background: transparent; color: var(--muted); border-radius: var(--r); cursor: pointer; transition: all 0.15s; }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tab-bar { display: flex; gap: 0; margin-bottom: 0; flex-wrap: nowrap; overflow-x: auto; align-items: center; border-bottom: 1px solid var(--border); scrollbar-width: none; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn { padding: 10px 16px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; margin-bottom: -1px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
    .tab-label { font-size: 12px; line-height: 1.3; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-count { font-size: 11px; font-family: 'IBM Plex Mono', monospace; background: var(--surface2); border-radius: 10px; padding: 1px 8px; margin-left: 0; color: var(--muted); display: block; }
    .tab-btn.active .tab-count { background: rgba(200,181,96,0.15); }
    .search-wrap { margin-left: 8px; }

    .player-list { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .list-header { display: grid; grid-template-columns: 40px 1fr 80px 70px 100px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .player-row { display: grid; grid-template-columns: 40px 1fr 80px 70px 100px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; transition: background 0.1s; }
    .player-row:last-child { border-bottom: none; }
    .player-row:hover { background: var(--surface2); }
    .rank { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
    .pname a { color: var(--text); text-decoration: none; font-weight: 500; }
    .pname a:hover { color: var(--accent); }
    .rating { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
    .score { font-family: 'IBM Plex Mono', monospace; font-weight: 600; text-align: right; }
    .badge { display: inline-block; font-size: 10px; font-family: 'IBM Plex Mono', monospace; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .badge-done { background: rgba(92,186,125,0.15); color: var(--green); }
    .badge-partial { background: rgba(212,168,48,0.15); color: var(--amber); }
    .badge-absent { background: rgba(217,96,96,0.1); color: var(--red); }
    .badge-loading { background: rgba(136,136,136,0.1); color: var(--muted); }

    .note { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; padding: 10px 14px; background: var(--surface2); border-left: 2px solid var(--accent); margin-bottom: 16px; }
    .error-box { padding: 14px 16px; background: rgba(217,96,96,0.07); border: 1px solid rgba(217,96,96,0.2); border-radius: var(--r); color: var(--red); font-family: 'IBM Plex Mono', monospace; font-size: 13px; white-space: pre-line; }
    .loading-row { display: flex; align-items: center; gap: 10px; padding: 28px 16px; color: var(--muted); font-size: 13px; font-family: 'IBM Plex Mono', monospace; }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .list-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .list-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; font-family: 'IBM Plex Mono', monospace; }
    .pagination { display: flex; align-items: center; gap: 4px; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .pg-btn { padding: 5px 10px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--border2); background: transparent; color: var(--muted); border-radius: var(--r); cursor: pointer; transition: all 0.15s; min-width: 32px; }
    .pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pg-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .pg-btn.all-btn { color: var(--accent); border-color: rgba(200,181,96,0.4); }
    .pg-btn.all-btn.active-all { background: rgba(200,181,96,0.15); }
    .pg-info { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); padding: 0 8px; flex: 1; text-align: center; white-space: nowrap; }
    #results { display: none; }
    .raffle-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; position: sticky; top: 20px; }
    .raffle-title { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .raffle-sub { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); margin-bottom: 14px; }
    .raffle-btn { width: 100%; padding: 11px; background: var(--accent); color: #0e0e0e; border: none; border-radius: var(--r); font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .raffle-btn:hover { background: var(--accent2); }
    .raffle-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .raffle-latest { margin-top: 14px; padding: 12px; background: rgba(200,181,96,0.1); border: 1px solid rgba(200,181,96,0.3); border-radius: var(--r); text-align: center; }
    .raffle-latest-name { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: var(--accent); }
    .raffle-latest-sub { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-top: 3px; }
    .raffle-history-label { font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
    .raffle-entry { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
    .raffle-entry:last-child { border-bottom: none; }
    .raffle-entry-num { color: var(--muted); min-width: 18px; }
    .raffle-entry-name { color: var(--text); flex: 1; }
    .raffle-entry-name a { color: var(--text); text-decoration: none; }
    .raffle-entry-name a:hover { color: var(--accent); }
    .raffle-reset { width: 100%; margin-top: 12px; padding: 7px; background: transparent; border: 1px solid var(--border2); border-radius: var(--r); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .raffle-reset:hover { border-color: var(--red); color: var(--red); }
    .raffle-del { background: none; border: none; color: var(--border2); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; transition: color 0.15s; flex-shrink: 0; }
    .raffle-del:hover { color: var(--red); }
    #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
    @keyframes raffle-spin { 0%{transform:scale(1) rotate(0deg);opacity:1} 40%{transform:scale(1.15) rotate(-8deg);opacity:1} 70%{transform:scale(1.1) rotate(6deg);opacity:1} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    .raffle-latest.popping { animation: raffle-spin 0.5s ease; }

    .main-layout { display: grid; grid-template-columns: 1fr 280px; gap: 16px; align-items: start; }

    @media (max-width: 760px) {
      body { padding: 16px 12px; }
      .main-layout { display: flex; flex-direction: column; gap: 16px; }
      .raffle-box { position: static; order: 1; }
      .list-col { order: 2; }
      .tab-btn { padding: 8px 12px; font-size: 12px; }
      .tab-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
      .tab-bar::-webkit-scrollbar { display: none; }
      .search-wrap { min-width: 120px; }
      header { margin-bottom: 20px; }
    }

    @media (max-width: 580px) {
      .list-header, .player-row { grid-template-columns: 28px 1fr 55px 80px; }
      .rating { display: none; }
      .logo-title { font-size: 15px; }
      .tour-title { font-size: 13px; }
      .tour-meta { font-size: 11px; }
      .copy-btn { padding: 6px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="page">

  <header>
    <div class="logo-box">♟</div>
    <div>
      <div class="logo-title">Lichess <span>Checker</span></div>
      <div class="logo-sub">Turnuva Tamamlama Analizi & Çekiliş</div>
    </div>
  </header>

  <div class="card">
    <label>Turnuva Linki</label>
    <input type="text" id="url" placeholder="https://lichess.org/swiss/xxxx  veya  /tournament/xxxx" />
    <div style="margin-top:12px;">
      <button id="btn" onclick="loadData()">▶ Kontrol Et</button>
    </div>
  </div>

  <div id="results">
    <div class="tour-title" id="tourTitle"></div>
    <div class="tour-meta" id="tourMeta"></div>

    <div id="noteBox" class="note" style="display:none;"></div>

    <div class="main-layout">

      <div class="list-col">
        <div class="tab-bar">
          <button class="tab-btn active" id="tab-all" onclick="setTab('all')">
            <span class="tab-label">Tüm<br>Oyuncular</span>
            <span class="tab-count" id="cnt-all"></span>
          </button>
          <button class="tab-btn" id="tab-completed" onclick="setTab('completed')">
            <span class="tab-label">Tüm Turları<br>Oynayanlar</span>
            <span class="tab-count col-green" id="cnt-completed"></span>
          </button>
          <button class="tab-btn" id="tab-lastround" onclick="setTab('lastround')">
            <span class="tab-label">Son Turu<br>Oynayanlar</span>
            <span class="tab-count col-amber" id="cnt-lastround"></span>
          </button>
          <button class="tab-btn" id="tab-custom" onclick="setTab('custom')">
            <span class="tab-label">En Az <span id="tab-custom-label">5</span><br>Oyun</span>
            <span class="tab-count col-amber" id="cnt-custom"></span>
          </button>
          <div style="flex:1"></div>
        </div>
        <div id="custom-panel" style="display:none; padding:12px 16px; background:var(--surface2); border-bottom:1px solid var(--border); display:none; align-items:center; gap:10px;">
          <span style="font-size:13px; font-family:'IBM Plex Mono',monospace; color:var(--muted);">En az kaç oyun:</span>
          <input type="number" id="customMin" value="5" min="1" max="99"
            style="width:70px; font-family:'IBM Plex Mono',monospace; font-size:13px;"
            oninput="document.getElementById('tab-custom-label').textContent=this.value||5; updateCustomCount(); renderList()" />
          <span style="font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace;" id="custom-result-label"></span>
        </div>
        <div class="list-toolbar">
          <div class="search-wrap" style="margin-left:0; flex:1; min-width:120px;">
            <input type="text" id="searchInput" placeholder="Oyuncu ara..." oninput="onSearch()" />
          </div>
          <div style="display:flex; align-items:center; gap:4px;">
            <button class="pg-btn" id="pg-first" onclick="goPage(0)" title="En başa">«</button>
            <button class="pg-btn" id="pg-prev" onclick="goPage(currentPage-1)" title="Önceki">‹</button>
            <span class="pg-info" id="pg-info">—</span>
            <button class="pg-btn" id="pg-next" onclick="goPage(currentPage+1)" title="Sonraki">›</button>
            <button class="pg-btn" id="pg-last" onclick="goPage(-1)" title="En sona">»</button>
            <button class="pg-btn all-btn" id="pg-all" onclick="toggleAll()" title="Tümünü göster">Tümü</button>
          </div>
          <button class="copy-btn" onclick="copyCompleted()" style="margin:0;">⊕ Kopyala</button>
        </div>

        <div class="player-list">
          <div class="list-header">
            <div>#</div><div>Oyuncu</div><div>Rating</div><div style="text-align:right">Puan</div><div style="text-align:right">Durum</div>
          </div>
          <div id="listBody"></div>
        </div>
      </div>

      <div class="raffle-box">
        <div class="raffle-title">Çekiliş</div>
        <div class="raffle-sub" id="raffle-pool-info">Aktif sekmeden çekilir</div>
        <button class="raffle-btn" id="raffle-btn" onclick="drawRaffle()">🎲 Çek</button>
        <div id="raffle-latest" class="raffle-latest" style="display:none;"></div>
        <div class="raffle-history-label" id="raffle-history-label" style="display:none;">Çekilen oyuncular</div>
        <div id="raffle-history"></div>
        <button class="raffle-reset" id="raffle-reset" onclick="resetRaffle()" style="display:none;">↺ Sıfırla</button>
        <button class="raffle-reset" id="raffle-copy" onclick="copyRaffle()" style="display:none; margin-top:6px;">⊕ Çekilenleri Kopyala</button>
      </div>

    </div>
  </div>

</div>
<script>
let allPlayers = [], currentFilter = 'all', maxR = 9;
let currentPage = 0, pageSize = 10, showAll = false;

const $ = id => document.getElementById(id);

function detectType(s) {
  if (s.includes('/swiss/')) return 'swiss';
  if (s.includes('/tournament/')) return 'arena';
  return 'unknown';
}
function extractId(s) {
  s = s.trim().replace(/\/$/, '');
  try { return new URL(s).pathname.split('/').filter(Boolean).pop(); }
  catch { return s.split('/').filter(Boolean).pop() || s; }
}
function parseNDJSON(t) {
  return t.trim().split('\n').filter(l => l.trim()).map(l => {
    try { return JSON.parse(l); } catch { return null; }
  }).filter(Boolean);
}
function pStatus(p) {
  const g = p._g ?? 0;
  if (g === -1) return 'loading';
  if (g >= maxR) return 'done';
  if (g > 0) return 'partial';
  return 'absent';
}
function setTab(t) {
  currentFilter = t;
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('tab-' + t);
  if (el) el.classList.add('active');
  const panel = $('custom-panel');
  if (panel) panel.style.display = t === 'custom' ? 'flex' : 'none';
  if (t === 'custom') setTimeout(() => {
    $('customMin').focus();
    const lbl = document.getElementById('tab-custom-label');
    if (lbl) lbl.textContent = $('customMin').value || 5;
  }, 50);
  currentPage = 0; showAll = false;
  renderList();
  if (typeof updateRaffleInfo === 'function') updateRaffleInfo();
}
function setFilter(f) { setTab(f); }
function getFiltered() {
  const q = ($('searchInput').value || '').toLowerCase();
  return allPlayers.filter(p => {
    if (q && !p._n.toLowerCase().includes(q)) return false;
    if (currentFilter === 'completed') return pStatus(p) === 'done';
    if (currentFilter === 'lastround') return p._lastRound === true;
    if (currentFilter === 'custom') {
      const min = parseInt($('customMin')?.value) || 1;
      return (p._g ?? 0) >= min;
    }
    return true;
  });
}

function renderList() {
  const data = getFiltered();
  const total = data.length;
  if (!total) { $('listBody').innerHTML = '<div class="empty">Oyuncu bulunamadı.</div>'; updatePagination(0, 0, 0); return; }

  const totalPages = Math.ceil(total / pageSize);
  if (currentPage >= totalPages) currentPage = totalPages - 1;
  if (currentPage < 0) currentPage = 0;

  const slice = showAll ? data : data.slice(currentPage * pageSize, (currentPage + 1) * pageSize);
  const startIdx = showAll ? 0 : currentPage * pageSize;

  $('listBody').innerHTML = slice.map((p, i) => {
    const s = pStatus(p);
    const bc = s === 'done' ? 'badge-done' : s === 'partial' ? 'badge-partial' : s === 'loading' ? 'badge-loading' : 'badge-absent';
    const bt = s === 'done' ? 'DONE' : s === 'partial' ? `${p._g}/${maxR}` : p._g === -1 ? '...' : 'YOK';
    return `<div class="player-row">
      <div class="rank">${startIdx + i + 1}</div>
      <div class="pname"><a href="https://lichess.org/@/${p._n}" target="_blank">${p._n}</a></div>
      <div class="rating">${p._r}</div>
      <div class="score">${p._s}</div>
      <div style="text-align:right"><span class="badge ${bc}">${bt}</span></div>
    </div>`;
  }).join('');

  updatePagination(currentPage, totalPages, total);
}

function updatePagination(page, totalPages, total) {
  const first = $('pg-first'), prev = $('pg-prev'), next = $('pg-next'), last = $('pg-last'), info = $('pg-info'), allBtn = $('pg-all');
  if (!info) return;
  if (showAll || totalPages <= 1) {
    info.textContent = `${total} oyuncu`;
    if (first) { first.disabled = true; prev.disabled = true; next.disabled = true; last.disabled = true; }
  } else {
    const from = page * pageSize + 1, to = Math.min((page + 1) * pageSize, total);
    info.textContent = `${from}-${to} / ${total}`;
    if (first) { first.disabled = page === 0; prev.disabled = page === 0; next.disabled = page >= totalPages - 1; last.disabled = page >= totalPages - 1; }
  }
  if (allBtn) allBtn.classList.toggle('active-all', showAll);
}

function goPage(p) {
  const data = getFiltered();
  const totalPages = Math.ceil(data.length / pageSize);
  if (p === -1) currentPage = totalPages - 1;
  else currentPage = Math.max(0, Math.min(p, totalPages - 1));
  showAll = false;
  renderList();
}

function toggleAll() {
  showAll = !showAll;
  renderList();
}

function onSearch() {
  currentPage = 0;
  showAll = false;
  renderList();
  updateRaffleInfo();
}
function updateStats() {
  const done = allPlayers.filter(p => pStatus(p) === 'done').length;
  const total = allPlayers.length;
  const rate = total ? Math.round(done / total * 100) : 0;
  $('cnt-all').textContent = total;
  $('cnt-completed').textContent = done;
  const lastround = allPlayers.filter(p => p._lastRound === true).length;
  const cntLR = $('cnt-lastround');
  if (cntLR) cntLR.textContent = lastround;
  updateCustomCount();
}
function updateCustomCount() {
  const min = parseInt($('customMin')?.value) || 1;
  const cnt = allPlayers.filter(p => (p._g ?? 0) >= min).length;
  $('cnt-custom').textContent = cnt;
  const lbl = $('custom-result-label');
  if (lbl) lbl.textContent = `→ ${cnt} oyuncu`;
}
function setLoading(msg) {
  $('listBody').innerHTML = `<div class="loading-row"><div class="spinner"></div>${msg}</div>`;
}
function showError(msg) {
  $('tourTitle').textContent = 'Hata';
  $('tourMeta').textContent = '';
  $('listBody').innerHTML = `<div class="error-box">❌ ${msg}</div>`;
}

async function loadData() {
  const urlVal = $('url').value.trim();
  if (!urlVal) { $('url').focus(); return; }

  const btn = $('btn');
  const _t0 = performance.now();
  btn.disabled = true;
  allPlayers = [];
  $('results').style.display = 'block';
  $('noteBox').style.display = 'none';
  $('tourTitle').textContent = 'Yükleniyor...';
  $('tourMeta').textContent = '';
  setLoading('Lichess API\'ye bağlanılıyor...');

  const type = detectType(urlVal);
  const id = extractId(urlVal);

  if (type === 'unknown') {
    showError('Link türü algılanamadı.\nURL\'de "/swiss/" veya "/tournament/" geçmeli.\nÖrnek: https://lichess.org/swiss/D92LT3Oe');
    btn.disabled = false;
    return;
  }

  try {
    if (type === 'swiss') {
      setLoading('Swiss turnuva bilgileri alınıyor...');
      const infoRes = await fetch(`https://lichess.org/api/swiss/${id}`);
      if (!infoRes.ok) throw new Error(`Turnuva bulunamadı (HTTP ${infoRes.status})\nID: ${id}`);
      const info = await infoRes.json();

      maxR = info.nbRounds || 9;
      const curRound = info.round || '?';
      $('tourTitle').textContent = info.name || 'Swiss Turnuvası';
      $('tourMeta').textContent = `Swiss · ${maxR} tur · Mevcut tur: ${curRound} · ${info.nbPlayers ?? '?'} oyuncu`;

      // AŞAMA 1: Oyuncu listesi hızlıca göster
      setLoading('Oyuncu listesi çekiliyor...');
      const res = await fetch(`https://lichess.org/api/swiss/${id}/results?nb=9999`);
      if (!res.ok) throw new Error(`Sonuçlar alınamadı (HTTP ${res.status})`);
      const text = await res.text();
      const raw = parseNDJSON(text);
      if (!raw.length) throw new Error('Henüz sonuç yok. Turnuva başlamamış olabilir.');

      const playerMap = {};
      raw.forEach(p => {
        const name = p.username || p.name || '?';
        playerMap[name.toLowerCase()] = {
          _n: name, _r: p.rating || '', _s: p.points ?? 0, _g: -1, _lastRound: false,
        };
      });

      // Aşama 1 bitti — listeyi hemen göster (_g=-1 = "yükleniyor")
      allPlayers = Object.values(playerMap);
      updateStats();
      setTab('all');
      $('searchInput').value = '';
      resetRaffle();
      const _elapsed1 = ((performance.now() - _t0) / 1000).toFixed(1);
      $('tourMeta').textContent += ` · ⏱ liste: ${_elapsed1}s`;
      $('noteBox').textContent = '⏳ Oyun verileri arka planda yükleniyor... Tamamlayanlar sekmesi hazırlanıyor.';
      $('noteBox').style.display = 'block';
      btn.disabled = false;

      // AŞAMA 2: PGN stream arka planda — listeyi bloklamadan
      (async () => {
        const gRes = await fetch(`https://lichess.org/api/swiss/${id}/games?moves=false&clocks=false&evals=false&opening=false`);
        if (!gRes.ok) {
          $('noteBox').textContent = '⚠ Oyun verisi alınamadı. Oynanma sayıları hesaplanamadı.';
          return;
        }
        const reader = gRes.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '', gameCount = 0;
        const gameOrder = []; // her oyunun white+black sırasıyla
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('[White "')) {
              const key = line.slice(8, -2).toLowerCase();
              gameOrder.push(key);
              if (playerMap[key]) playerMap[key]._g === -1 ? playerMap[key]._g = 1 : playerMap[key]._g++;
            } else if (line.startsWith('[Black "')) {
              const key = line.slice(8, -2).toLowerCase();
              gameOrder.push(key);
              if (playerMap[key]) { playerMap[key]._g === -1 ? playerMap[key]._g = 1 : playerMap[key]._g++; gameCount++; }
              if (gameCount % 200 === 0) {
                $('noteBox').textContent = `⏳ ${gameCount} oyun işlendi, devam ediyor...`;
                allPlayers = Object.values(playerMap);
                updateStats(); renderList();
              }
            }
          }
        }
        // Kalan buffer
        if (buffer.startsWith('[White "')) { const k=buffer.slice(8,-2).toLowerCase(); if(playerMap[k]) { if(playerMap[k]._g === -1) playerMap[k]._g = 1; else playerMap[k]._g++; } }
        else if (buffer.startsWith('[Black "')) { const k=buffer.slice(8,-2).toLowerCase(); if(playerMap[k]) { if(playerMap[k]._g === -1) playerMap[k]._g = 1; else playerMap[k]._g++; } }

        // 0 oyun görünenleri düzelt (_g hala -1 ise hiç oynamamış)
        Object.values(playerMap).forEach(p => { if (p._g === -1) p._g = 0; });

        // Son tur oynayanları belirle: son round'daki oyunlar = gameOrder'ın son (totalGames/maxR) kısmı
        const gamesPerRound = Math.round(gameCount / maxR);
        const lastRoundPlayers = new Set(gameOrder.slice(-gamesPerRound * 2));
        lastRoundPlayers.forEach(name => { if (playerMap[name]) playerMap[name]._lastRound = true; });
        allPlayers = Object.values(playerMap);
        updateStats(); renderList();
        const _elapsed2 = ((performance.now() - _t0) / 1000).toFixed(1);
        $('noteBox').textContent = `✓ Tüm veriler yüklendi. Toplam süre: ${_elapsed2}s · ${gameCount} oyun işlendi.`;
        updateRaffleInfo();
      })();

      // Aşama 2 arka planda, ana akış burada biter
      return;

    } else {
      setLoading('Arena turnuva bilgileri alınıyor...');
      const infoRes = await fetch(`https://lichess.org/api/tournament/${id}`);
      if (!infoRes.ok) throw new Error(`Turnuva bulunamadı (HTTP ${infoRes.status})\nID: ${id}`);
      const info = await infoRes.json();
      $('tourTitle').textContent = info.fullName || info.name || 'Arena Turnuvası';

      setLoading('Tüm sayfalar çekiliyor...');
      let page = 1, hasMore = true;
      while (hasMore && page <= 30) {
        const r = await fetch(`https://lichess.org/api/tournament/${id}?page=${page}`);
        if (!r.ok) break;
        const d = await r.json();
        const players = d.standing?.players || [];
        if (!players.length) break;
        allPlayers.push(...players.map(p => ({
          _n: p.name || p.username || '?',
          _r: p.rating || '',
          _s: p.score ?? 0,
          _g: p.nb?.game || 0,
        })));
        hasMore = players.length >= 10;
        page++;
      }
      if (!allPlayers.length) throw new Error('Henüz oyuncu yok.');
      maxR = Math.max(...allPlayers.map(p => p._g), 1);
      const typeLabel = info.variant?.key?.toUpperCase() || 'Arena';
      $('tourMeta').textContent = `${typeLabel} · ${allPlayers.length} oyuncu · Maks oyun: ${maxR}`;
    }

    updateStats();
    currentFilter = 'all';
    setTab('all');
    $('searchInput').value = '';
    resetRaffle();
    const _elapsed = ((performance.now() - _t0) / 1000).toFixed(1);
    $('tourMeta').textContent += ` · ⏱ ${_elapsed}s`;
    renderList();

  } catch (e) {
    showError(e.message);
    btn.disabled = false;
  }
}

function copyCompleted() {
  const data = getFiltered();
  const names = data.map(p => p._n).join('\n');
  if (!names) { alert('Oyuncu yok.'); return; }
  navigator.clipboard.writeText(names).then(() => {
    const b = document.querySelector('.copy-btn');
    const prev = b.textContent;
    b.textContent = '✓ Kopyalandı!';
    setTimeout(() => b.textContent = prev, 2000);
  });
}

$('url').addEventListener('keydown', e => { if (e.key === 'Enter') loadData(); });

// ===== ÇEKİLİŞ =====
let raffleDrawn = new Set();

function getActivePool() {
  // Çekiliş aramadan bağımsız — sadece aktif tab filtresi
  return allPlayers.filter(p => {
    if (p._g === -1) return false;
    if (raffleDrawn.has(p._n)) return false;
    if (currentFilter === 'completed') return pStatus(p) === 'done';
    if (currentFilter === 'lastround') return p._lastRound === true;
    if (currentFilter === 'custom') {
      const min = parseInt($('customMin')?.value) || 1;
      return (p._g ?? 0) >= min;
    }
    return true;
  });
}

function updateRaffleInfo() {
  const btn = $('raffle-btn');
  const info = $('raffle-pool-info');
  if (!btn || !info) return;
  const pool = getActivePool();
  const total = allPlayers.filter(p => {
    if (currentFilter === 'completed') return pStatus(p) === 'done';
    if (currentFilter === 'lastround') return p._lastRound === true;
    if (currentFilter === 'custom') {
      const min = parseInt($('customMin')?.value) || 1;
      return (p._g ?? 0) >= min;
    }
    return true;
  }).length;
  info.textContent = `${pool.length} / ${total} oyuncu havuzda`;
  const drawn = raffleDrawn.size;
  btn.textContent = pool.length > 0 ? `🎲 Çek (${drawn}/${total})` : `🎲 Havuz boş (${drawn}/${total})`;
  btn.disabled = pool.length === 0;
}

function drawRaffle() {
  const pool = getActivePool();
  if (!pool.length) return;
  const winner = pool[Math.floor(Math.random() * pool.length)];
  raffleDrawn.add(winner._n);

  // Animate latest box
  const latest = $('raffle-latest');
  latest.style.display = 'block';
  latest.classList.remove('popping');
  void latest.offsetWidth;
  latest.classList.add('popping');
  latest.innerHTML = `<div class="raffle-latest-name">🎉 ${winner._n}</div>
    <div class="raffle-latest-sub">${winner._r ? 'Rating: ' + winner._r + ' · ' : ''}Puan: ${winner._s}</div>`;

  // Confetti burst
  launchConfetti();

  // Add to history with delete button
  const history = $('raffle-history');
  const count = raffleDrawn.size;
  const entry = document.createElement('div');
  entry.className = 'raffle-entry';
  entry.dataset.name = winner._n;
  entry.innerHTML = `<span class="raffle-entry-num">${count}.</span>
    <span class="raffle-entry-name"><a href="https://lichess.org/@/${winner._n}" target="_blank">${winner._n}</a></span>
    <button class="raffle-del" title="Sil" onclick="deleteRaffleEntry(this, '${winner._n}')">✕</button>`;
  history.insertBefore(entry, history.firstChild);

  $('raffle-history-label').style.display = 'block';
  $('raffle-reset').style.display = 'block';
  $('raffle-copy').style.display = 'block';
  updateRaffleInfo();
}

function deleteRaffleEntry(btn, name) {
  raffleDrawn.delete(name);
  btn.closest('.raffle-entry').remove();
  // Renumber remaining entries
  const entries = $('raffle-history').querySelectorAll('.raffle-entry');
  entries.forEach((el, i) => {
    el.querySelector('.raffle-entry-num').textContent = (entries.length - i) + '.';
  });
  if (!raffleDrawn.size) {
    $('raffle-history-label').style.display = 'none';
    $('raffle-reset').style.display = 'none';
    $('raffle-copy').style.display = 'none';
    $('raffle-latest').style.display = 'none';
  }
  updateRaffleInfo();
}

function launchConfetti() {
  const canvas = $('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#c8b560','#5cba7d','#6098d4','#d4537e','#e8d080','#5dcaa5'];
  const particles = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height * 0.4,
    r: Math.random() * 6 + 3,
    d: Math.random() * 60 + 20,
    color: colors[Math.floor(Math.random() * colors.length)],
    tilt: Math.random() * 10 - 10,
    tiltAngle: 0,
    tiltSpeed: Math.random() * 0.1 + 0.05,
    vy: Math.random() * 3 + 2,
    vx: Math.random() * 2 - 1,
    opacity: 1,
  }));

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.tiltAngle += p.tiltSpeed;
      p.y += p.vy;
      p.x += p.vx;
      p.opacity -= 0.012;
      p.tilt = Math.sin(p.tiltAngle) * 12;
      ctx.beginPath();
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.ellipse(p.x, p.y, p.r, p.r * 0.4, p.tilt, 0, Math.PI * 2);
      ctx.fill();
    });
    frame++;
    if (frame < 120) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(animate);
}

function resetRaffle() {
  raffleDrawn.clear();
  $('raffle-latest').style.display = 'none';
  $('raffle-history').innerHTML = '';
  $('raffle-history-label').style.display = 'none';
  $('raffle-reset').style.display = 'none';
  $('raffle-copy').style.display = 'none';
  updateRaffleInfo();
}
function copyRaffle() {
  const names = [...raffleDrawn].join('\n');
  if (!names) return;
  navigator.clipboard.writeText(names).then(() => {
    const b = $('raffle-copy');
    const prev = b.textContent;
    b.textContent = '✓ Kopyalandı!';
    setTimeout(() => b.textContent = prev, 2000);
  });
}
